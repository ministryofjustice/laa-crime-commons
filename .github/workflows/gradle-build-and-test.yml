name: Gradle build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=true --add-opens=java.prefs/java.util.prefs=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED"
      _JAVA_OPTIONS: "-Xmx3g"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 #v5
        with:
          java-version: 25
          distribution: 'corretto'

      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e #v6

      - name: Build and test all modules
        run: |
          chmod +x ./gradlew
          ./gradlew \
            -x printSemver \
            crime-commons-spring-boot-starter-rest-client:shadowJar \
            crime-commons-spring-boot-starter-rest-client:build \
            crime-commons-classes:build \
            crime-commons-schemas:build \
            crime-commons-mod-schemas:build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
        with:
          name: test-reports
          path: '*/build/reports/tests'
          retention-days: 14

      - name: Upload jacoco coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7
        with:
          name: jacoco-coverage-reports
          path: '*/build/reports/jacoco/test'
          retention-days: 14
          if-no-files-found: ignore
