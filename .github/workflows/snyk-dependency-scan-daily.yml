name: Snyk SCA scan (daily)

# Reports `high` and above. Scheduled only, so it never blocks a merge.

on:
  schedule:
    - cron: '0 7 * * 1-5' # 07:00 UTC, weekdays
  workflow_dispatch:

jobs:
  scan:
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/snyk-sca-scan.yml@a7a2b7cda8092fdcbf1224ddc2b51125645352f1 # main as of 09/11/2026
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      build_tool: gradle
      scan_all_projects: true
      java_version: "25"
      minimum_threshold: high
    secrets:
      SNYK_CLIENT_ID: ${{ secrets.SNYK_CLIENT_ID }}
      SNYK_CLIENT_SECRET: ${{ secrets.SNYK_CLIENT_SECRET }}
