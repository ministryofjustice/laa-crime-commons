plugins {
    id 'com.javiersc.semver' version "$semverVersion"
    id 'org.sonarqube' version "$sonarQubeVersion"
    id 'org.springframework.boot' version "$springframeworkBootVersion"
    id 'io.spring.dependency-management' version "$springDependencyManagementVersion"
    id 'io.github.gradle-nexus.publish-plugin' version "$publishPluginVersion"
}

group = "uk.gov.justice.service.laa-crime"

subprojects {
    apply plugin: "java"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        withSourcesJar()
        withJavadocJar()
    }

    // Disable warnings for missing JavaDoc
    javadoc.options.addStringOption('Xdoclint:none', '-quiet')

    group = "uk.gov.justice.service.laa-crime"

    repositories {
        mavenCentral()
    }

    // Jackson BOM override to fix Snyk-flagged Spring Boot 4.1.1 managed versions
    // (SNYK-JAVA-COMFASTERXMLJACKSONCORE-20059179 / SNYK-JAVA-COMFASTERXMLJACKSONCORE-20059683 /
    // SNYK-JAVA-TOOLSJACKSONCORE-20059180 / SNYK-JAVA-TOOLSJACKSONCORE-20059682).
    // Only affects subprojects that apply the Spring Boot dependency-management plugin.
    // TODO: re-evaluate/remove on next Spring Boot version bump.
    ext['jackson-2-bom.version'] = '2.21.7'
    ext['jackson-bom.version'] = '3.1.7'

    // Netty version override to fix Snyk-flagged Spring Boot 4.1.1 managed version
    // (SNYK-JAVA-IONETTY-20074868 / SNYK-JAVA-IONETTY-20074880).
    // TODO: re-evaluate/remove on next Spring Boot version bump.
    ext['netty.version'] = '4.2.18.Final'
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl = uri("https://ossrh-staging-api.central.sonatype.com/service/local/")
            snapshotRepositoryUrl = uri("https://central.sonatype.com/repository/maven-snapshots/")
            username = project.findProperty("sonatypeUsername") ?: System.getenv("SONATYPE_USERNAME")
            password = project.findProperty("sonatypePassword") ?: System.getenv("SONATYPE_PASSWORD")
        }
    }
    useStaging.set(provider {
        !(project.property("isSnapshot").toString()).toBoolean()
    } as Provider<? extends Boolean>)
}

sonar {
    properties {
        property "sonar.projectName", "laa-crime-commons"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.organization", "ministryofjustice"
        property "sonar.projectKey", "ministryofjustice_laa-crime-commons"
    }
}

project(":crime-commons-spring-boot-starter-rest-client") {
    sonar {
        properties {
            property "sonar.coverage.jacoco.xmlReportPaths",
                    "${project(":crime-commons-spring-boot-starter-rest-client").buildDir}/reports/jacoco/test/jacocoTestReport.xml"
            property "sonar.exclusions", "**/RetryConfiguration.java, **/exception/**.java, **/ErrorDTO.java"
            property "sonar.coverage.exclusions", "**/RetryConfiguration.java, **/exception/**.java, **/ErrorDTO.java"
        }
    }
}


project(":crime-commons-classes") {
    sonar {
        properties {
            property "sonar.coverage.jacoco.xmlReportPaths",
                    "${project(":crime-commons-classes").buildDir}/reports/jacoco/test/jacocoTestReport.xml"
            property "sonar.exclusions", "**/exception/**.java, **/enums/**.java"
            property "sonar.coverage.exclusions", "**/exception/**.java, **/enums/**.java, **/error/**"
        }
    }
}

project(":crime-commons-samples") {
    apply plugin: "org.springframework.boot"
    sonar {
        skipProject = true
    }
}
